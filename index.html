<!doctype html>
<html lang="sv" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hemmet</title>
  <meta name="description" content="Hemmet – vår delade vardag: kalender, listor, anteckningar och utgifter.">
  <script>
    // Sätt temat innan något ritas, så att sidan inte blinkar.
    (function () {
      var pref = 'dark';
      try { pref = localStorage.getItem('hemmet-theme') || 'dark'; } catch (e) {}
      var theme = pref;
      if (pref === 'system') {
        theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      if (theme !== 'light') theme = 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta name="theme-color" content="#0e1413">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hemmet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot" role="status">
      <div class="boot-mark" aria-hidden="true"></div>
      <span class="sr-only">Laddar Hemmet…</span>
    </div>
  </div>
  <noscript><p class="noscript">Hemmet behöver JavaScript för att fungera.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
